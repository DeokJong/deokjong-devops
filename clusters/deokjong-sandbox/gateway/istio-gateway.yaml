apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: https-jinops-root
      hostname: jinops.cloud
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-jinops-cloud-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-jinops-wildcard
      hostname: "*.jinops.cloud"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-jinops-cloud-tls
      allowedRoutes:
        namespaces:
          from: All

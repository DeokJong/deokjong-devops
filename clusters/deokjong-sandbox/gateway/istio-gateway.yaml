apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: tcp
    - name: https
      port: 443
      protocol: tcp
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-jinjin99-xyz-tls

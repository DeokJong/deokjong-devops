apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: terrakube-api-secrets
  namespace: terrakube
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: terrakube-api-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      data:
        PatSecret: "{{ .patSecret | b64enc }}"
        InternalSecret: "{{ .internalSecret | b64enc }}"
        DexClientId: "terrakube-ui"
        TerrakubeRedisPassword: "{{ .valkeyPassword }}"
        DatasourcePassword: "{{ .postgresPassword }}"
  data:
    - secretKey: patSecret
      remoteRef:
        key: terrakube/deokjong-sandbox
        property: patSecret
    - secretKey: internalSecret
      remoteRef:
        key: terrakube/deokjong-sandbox
        property: internalSecret
    - secretKey: valkeyPassword
      remoteRef:
        key: terrakube/deokjong-sandbox
        property: valkeyPassword
    - secretKey: postgresPassword
      remoteRef:
        key: terrakube/deokjong-sandbox
        property: postgresPassword
---
